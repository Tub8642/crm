<!DOCTYPE html>
<html>
<head>
    <title>Автомобили</title>
</head>
<body>
    <h1>Список автомобилей</h1>
    <ul>
        {% for car in cars %}
            <li>
                <a href="{% url 'cars:detail' car.pk %}">
                    {{ car.brand }} {{ car.model }} ({{ car.license_plate }})
                </a>
            </li>
        {% empty %}
            <li>Нет автомобилей</li>
        {% endfor %}
    </ul>
</body>
</html>
