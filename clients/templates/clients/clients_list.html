<!DOCTYPE html>
<html>
<head>
    <title>Список клиентов</title>
</head>
<body>
    <h1>Клиенты</h1>
    <ul>
        {% for client in clients %}
            <li>
                <a href="{% url 'clients:detail' client.pk %}">{{ client.name }}</a>
            </li>
        {% empty %}
            <li>Нет клиентов</li>
        {% endfor %}
    </ul>
</body>
</html>
